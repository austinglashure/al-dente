# cargo-deny configuration. Run: cargo deny check

[graph]
all-features = true

[advisories]
version = 2

[licenses]
version = 2
# Anything not listed is denied, including unknown licenses.
allow = [
    "AGPL-3.0-only", # this workspace's own crates
    "MIT",
    "MIT-0", # borrow-or-share (via jsonschema, dev-only)
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
]
confidence-threshold = 0.93

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
