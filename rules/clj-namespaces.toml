# Library attribution for Clojure namespaces (R10 in
# docs/plan/04-clojure-analysis.md). Order of the ladder: npm string
# requires, jars in the local Maven cache (certain), this `[[prefix]]` table
# (likely), `[[core]]` (certain), then prefixes derived from the declared
# dependencies (likely). The longest matching prefix wins.

# Rule 4: the language's own namespaces. Checked after the table, so
# `clojure.core.async` goes to its own artifact.
[[core]]
prefix = "clojure"
coord = "org.clojure/clojure"

[[core]]
prefix = "cljs"
coord = "org.clojure/clojurescript"

# Rule 3: namespaces whose artifact a prefix of the declared coordinate
# would not find, or that are commonly used without being declared.
[[prefix]]
prefix = "clojure.core.async"
coord = "org.clojure/core.async"

[[prefix]]
prefix = "cljs.core.async"
coord = "org.clojure/core.async"

[[prefix]]
prefix = "clojure.core.match"
coord = "org.clojure/core.match"

[[prefix]]
