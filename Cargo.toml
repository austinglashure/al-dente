[workspace]
resolver = "3"
members = ["crates/*"]
# Plain `cargo run` / `cargo build` mean the `aldente` binary. Workspace-wide
# commands (tests, clippy, the acceptance runner) name `--workspace` or `-p`.
default-members = ["crates/aldente-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
aldente-model = { path = "crates/aldente-model" }
anyhow = "1"
insta = "1"
clap = { version = "4", features = ["derive"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
which = "8"
dirs = "7"
ignore = "0.4"
blake3 = "1"
rayon = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "signal"] }
rust-embed = "8"
toml = "1"
# `find --regex` (05-cli.md); linear-time matching, so a hostile pattern cannot hang a search.
regex = "1"
rusqlite = { version = "0.42", features = ["bundled"] }
tree-sitter = "0.26"
tree-sitter-clojure-orchard = "0.2"
aldente-acquire = { path = "crates/aldente-acquire" }
aldente-adapter = { path = "crates/aldente-adapter" }
aldente-graph = { path = "crates/aldente-graph" }
aldente-server = { path = "crates/aldente-server" }
aldente-clj = { path = "crates/aldente-clj" }
aldente-testkit = { path = "crates/aldente-testkit" }
aldente-rules = { path = "crates/aldente-rules" }
aldente-analysis = { path = "crates/aldente-analysis" }
bench = { path = "crates/bench" }
# dev-only
jsonschema = { version = "0.61", default-features = false }
proptest = "1"
# Source map v3 for ClojureScript traces (08-crater-and-traces.md names it).
sourcemap = { version = "9", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

# Allowed inside tests via clippy.toml.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
strip = true
# panic = "unwind" is the default and is kept on purpose: the server must
# survive a panic inside one request.
