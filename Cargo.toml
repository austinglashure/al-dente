[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
aldente-model = { path = "crates/aldente-model" }
anyhow = "1"
insta = "1"
clap = { version = "4", features = ["derive"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
which = "8"
dirs = "7"
aldente-acquire = { path = "crates/aldente-acquire" }
# dev-only
jsonschema = { version = "0.61", default-features = false }
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

# Allowed inside tests via clippy.toml.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
strip = true
# panic = "unwind" is the default and is kept on purpose: the server must
# survive a panic inside one request.
