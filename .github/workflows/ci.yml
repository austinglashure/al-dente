name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CLJ_KONDO_VERSION: "2026.10.26"

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Windows paused (Austin, 2026-11-20): it still runs and reports, but a
    # failure does not fail the run. See PROGRESS.md.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install clj-kondo (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -sSfL -o kondo.zip "https://github.com/clj-kondo/clj-kondo/releases/download/v${CLJ_KONDO_VERSION}/clj-kondo-${CLJ_KONDO_VERSION}-linux-amd64.zip"
          mkdir -p "$HOME/.local/bin" && unzip -o kondo.zip -d "$HOME/.local/bin" && rm kondo.zip
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install clj-kondo (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -sSfL -o kondo.zip "https://github.com/clj-kondo/clj-kondo/releases/download/v${CLJ_KONDO_VERSION}/clj-kondo-${CLJ_KONDO_VERSION}-macos-aarch64.zip"
          mkdir -p "$HOME/.local/bin" && unzip -o kondo.zip -d "$HOME/.local/bin" && rm kondo.zip
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install clj-kondo (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = Join-Path $env:USERPROFILE "clj-kondo"
          Invoke-WebRequest -Uri "https://github.com/clj-kondo/clj-kondo/releases/download/v$env:CLJ_KONDO_VERSION/clj-kondo-$env:CLJ_KONDO_VERSION-windows-amd64.zip" -OutFile kondo.zip
          Expand-Archive -Path kondo.zip -DestinationPath $dir -Force
          Remove-Item kondo.zip
          Add-Content -Path $env:GITHUB_PATH -Value $dir

      - name: clj-kondo version
        run: clj-kondo --version

      # WP0.3: the fixture must stay valid Clojure. Exit 2 = warnings (fine), 3 = errors.
      - name: lint clj-mini fixture
        shell: bash
        run: |
          set +e
          clj-kondo --lint fixtures/clj-mini
          code=$?
          if [ "$code" -ge 3 ]; then exit "$code"; fi

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

      - name: deny
        run: cargo deny check

      # WP1.9: the UI. ui/dist is committed so `cargo build` works without
      # Node; CI rebuilds it and fails if the committed copy is stale.
      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: UI check, unit tests, build, dist up to date (Linux)
        if: runner.os == 'Linux'
        working-directory: ui
        run: |
          npm ci
          npm run check
          npm test
          npm run build
          git diff --exit-code -- dist

      - name: UI end-to-end tests (Linux)
        if: runner.os == 'Linux'
        working-directory: ui
        run: |
          npx playwright install --with-deps chromium
          npm run e2e

      # WP5.2: scale acceptance on the synthetic corpus (ui/e2e/large.spec.ts).
      # Runners draw WebGL in software (SwiftShader: about 4 frames a second
      # locally, 35 on an integrated GPU), so time budgets are multiplied by
      # 10 here and the frame-rate floor is not checked (it needs ALDENTE_E2E_GPU=1).
      - name: UI scale test on the synthetic corpus (Linux, relaxed 10x)
        if: runner.os == 'Linux'
        working-directory: ui
        run: |
          cargo build --release -p aldente-cli -p bench
          ALDENTE_E2E_LARGE=1 ALDENTE_E2E_RELAXED=10 ALDENTE_BIN=../target/release/aldente npx playwright test e2e/large.spec.ts

      # WP0.4: doctor must find the real git and clj-kondo (clj-kondo.exe on Windows).
      - name: doctor
        run: cargo run -q -p aldente-cli -- doctor

      # WP1.7: the DOT output must be valid Graphviz input.
      - name: graph --format dot renders with Graphviz (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get install -y graphviz
          cp -r fixtures/clj-mini "$RUNNER_TEMP/clj-mini"
          set -o pipefail
          cargo run -q -p aldente-cli -- graph --level namespace --format dot "$RUNNER_TEMP/clj-mini" | dot -Tsvg > "$RUNNER_TEMP/clj-mini.svg"

