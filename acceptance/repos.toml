# Acceptance repositories for milestone M1 (docs/plan/phases/phase-01.md,
# WP1.10). Stand-ins from docs/plan/open-questions.md, pinned by commit.
# Facts were read from each repository's source at the pinned commit, not
# from Al Dente's output.
#
# Run: cargo run -p acceptance            (all)
#      cargo run -p acceptance -- ring    (one)
#
# Fact kinds: `node` (id exists), `edge` (from -kind-> to exists; optional
# `reason` and `certainty` must match too), `no-edge` (it must not exist).
#
# M2 (WP2.10) adds at least five dispatch facts per repository, each read
# from the source line noted beside it.

